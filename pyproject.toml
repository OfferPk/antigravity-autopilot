[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-autopilot"
version = "0.1.0"
description = "Local, keyless Antigravity SDK coding workflow with guarded GitHub branch publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-antigravity>=0.1.0",
  "mcp>=1.8.0,<2",
]

[project.scripts]
agy-autopilot = "agy_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["agy_autopilot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
